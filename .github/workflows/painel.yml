name: Painel

on:
  push:
    branches: [main]
    paths: ["web/**", "results/**", "site-data/**", "schemas/**", ".github/workflows/painel.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar o painel
    runs-on: ubuntu-latest
    outputs:
      publicar: ${{ steps.trava.outputs.publicar }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - name: Trava de publicação (dado de exemplo nunca é publicado)
        id: trava
        run: |
          if uv run labia publish-check; then
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          else
            echo "publicar=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Painel compilado, mas não publicado: os resultados ainda são de exemplo."
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - if: steps.trava.outputs.publicar == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    name: Publicar no GitHub Pages
    needs: build
    if: needs.build.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
