[project]
name = "labia"
version = "0.1.0"
description = "Treinar um LLM pequeno e aberto para não cair em engenharia social em português, medindo fraude × atrito, custo e latência."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Denis Carvalho", email = "denis.carvalho.tech@gmail.com" }]
dependencies = [
    "pydantic>=2.8",
    "numpy>=1.26",
    "openai>=1.40",
    "pyyaml>=6.0",
]

[project.scripts]
labia = "labia.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labia"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
# Os notebooks rodam célula a célula no Kaggle e são documentos didáticos: ficam fora do lint.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PT"]
# RUF001-003: o projeto é em português e usa "×", "–" e aspas tipográficas de propósito.
# E501: o formatador (ruff format) já cuida do tamanho das linhas de código; textos longos ficam inteiros.
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["hypothesis.*"]
ignore_missing_imports = true

# Bibliotecas de GPU: só existem no Kaggle. O treino é testado lá, nos testes de fumaça.
[[tool.mypy.overrides]]
module = ["torch.*", "transformers.*", "peft.*", "unsloth.*", "llama_cpp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["labia"]
branch = true
